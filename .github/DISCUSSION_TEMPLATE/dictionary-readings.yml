body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping us improve the dictionary. Everything here is public, so please don't include your email address or account details. For private or account issues, email support@10ten.life.

        Please search first. If someone has already reported this word or sentence, click the ▲ upvote arrow on their post instead.

        If the app itself is broken (it crashes, freezes, or a button doesn't work), please post in Bugs instead.
  - type: input
    id: query
    attributes:
      label: Word or sentence
      description: Paste the word or sentence exactly as you searched it.
    validations:
      required: true
  - type: dropdown
    id: kind
    attributes:
      label: What kind of problem is it?
      options:
        - Wrong or missing meaning
        - Wrong reading or pitch accent
        - Wrong furigana or word splitting in a sentence
        - Missing word
        - Something else
    validations:
      required: true
  - type: textarea
    id: what-is-wrong
    attributes:
      label: What's wrong?
      description: What does 10ten show, and what should it show instead?
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: Source
      description: Optional. A dictionary, website, or book that shows the correct version.
  - type: input
    id: environment
    attributes:
      label: Browser and device
      description: Write what you know. It's fine if you're not sure.
      placeholder: e.g. Chrome on Windows, Safari on iPhone
