body:
  - type: markdown
    attributes:
      value: |
        Everything here is public, so please don't include your email address or account details. For private or account issues, email support@10ten.life.

        Please search first. If someone has already suggested this, click the ▲ upvote arrow on their post instead.
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the problem or situation, not just the solution. This helps us find the best fix.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help?
      description: How would you like 10ten to handle this?
